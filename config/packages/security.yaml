security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Browser-facing OAuth authorization + consent. Stateful so the user
        # logs in with a session before granting an MCP client access.
        oauth:
            pattern: ^/oauth/(authorize|login)
            provider: app_user_provider
            lazy: true
            # Preserve the authorization query when redirecting to the login form
            # so the resume works without a (multi-instance-unshared) session
            # target path. See App\OAuth\Security\OAuthLoginEntryPoint.
            entry_point: App\OAuth\Security\OAuthLoginEntryPoint
            form_login:
                login_path: oauth_login
                check_path: oauth_login
                enable_csrf: true

        # MCP endpoint — OAuth bearer-token resource server. Stock access_token
        # handling; the RFC 9728 resource_metadata pointer on 401s is added by
        # App\Mcp\EventListener\McpProtectedResourceChallengeListener.
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: app_user_provider
            access_token:
                token_handler: App\OAuth\Security\OAuthAccessTokenHandler

    access_control:
        - { path: ^/\.well-known/, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/login, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/register, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/token, roles: PUBLIC_ACCESS }
        # The authorization endpoint requires an authenticated user to consent.
        - { path: ^/oauth/authorize, roles: ROLE_USER }
        # The MCP endpoint requires a valid OAuth access token.
        - { path: ^/mcp, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
